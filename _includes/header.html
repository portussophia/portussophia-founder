<header class="site-header ps-header" role="banner">
  <div class="site-shell header-shell">
    <a class="site-wordmark" rel="author" href="{{ "/" | relative_url }}">
      <span class="wordmark-name">James Roy Dennis</span>
      <span class="wordmark-role">Founder Portfolio</span>
    </a>

    {%- if site.header_pages -%}
      <nav class="site-nav" aria-label="Primary navigation">
        <input type="checkbox" id="nav-trigger" class="nav-trigger">
        <label for="nav-trigger" aria-label="Toggle navigation">
          <span class="menu-icon"><svg viewBox="0 0 18 15" width="18" height="15" aria-hidden="true"><path d="M18,1.5c0,0.8-0.7,1.5-1.5,1.5h-15C0.7,3,0,2.3,0,1.5S0.7,0,1.5,0h15C17.3,0,18,0.7,18,1.5z M18,7.5C18,8.3,17.3,9,16.5,9h-15C0.7,9,0,8.3,0,7.5S0.7,6,1.5,6h15C17.3,6,18,6.7,18,7.5z M18,13.5c0,0.8-0.7,1.5-1.5,1.5h-15C0.7,15,0,14.3,0,13.5S0.7,12,1.5,12h15C17.3,12,18,12.7,18,13.5z"></path></svg></span>
        </label>
        <div class="trigger">
          {%- for path in site.header_pages -%}
            {%- assign nav_page = site.pages | where: "path", path | first -%}
            {%- if nav_page.title -%}
              <a class="page-link{% if page.url == nav_page.url %} is-active{% endif %}" href="{{ nav_page.url | relative_url }}">{{ nav_page.nav_title | default: nav_page.title | escape }}</a>
            {%- endif -%}
          {%- endfor -%}
        </div>
      </nav>
    {%- endif -%}
  </div>
</header>
