---
layout: default
---
<main class="portfolio-page page-{{ page.slug | default: page.name | slugify }}">
  {%- if page.show_header != false -%}
    <header class="page-header">
      {%- if page.kicker -%}<p class="eyebrow">{{ page.kicker }}</p>{%- endif -%}
      <h1>{{ page.title | escape }}</h1>
      {%- if page.summary -%}<p class="page-summary">{{ page.summary }}</p>{%- endif -%}
    </header>
  {%- endif -%}
  <div class="page-content prose">
    {{ content }}
  </div>
</main>
